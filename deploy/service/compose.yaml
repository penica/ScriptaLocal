x-runtime: &runtime
  user: '${SCRIPTALOCAL_UID:-1000}:${SCRIPTALOCAL_GID:-1000}'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=128m]
  pids_limit: 256
  logging: &logs
    options:
      max-size: 5m
      max-file: '2'

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN,DAC_OVERRIDE,FOWNER,SETUID,SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,/var/run/postgresql:size=16m]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=trust'
    command: [postgres,-c,log_statement=none,-c,log_min_error_statement=panic,-c,log_error_verbosity=terse,-c,log_parameter_max_length=0,-c,log_parameter_max_length_on_error=0]
    volumes:
      - ${SCRIPTALOCAL_SERVICE_ROOT:?}/postgres:/var/lib/postgresql/data
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/admin-password:/run/secrets/admin_password:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/app-password:/run/secrets/app_password:ro
      - ./01-application.sql:/docker-entrypoint-initdb.d/01-application.sql:ro
    healthcheck:
      test: [CMD,pg_isready,-U,postgres,-d,scriptalocal]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    logging: *logs
    networks: [backend]
  migrate:
    <<: *runtime
    profiles: [tools]
    image: ${SCRIPTALOCAL_API_IMAGE:?Set tested immutable API image ID}
    depends_on:
      db: {condition: service_healthy}
    command: [python,-m,scriptalocal.service_admin,migrate,--dsn-file,/run/secrets/db_dsn,--artifacts,/data/artifacts]
    volumes:
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/db-dsn:/run/secrets/db_dsn:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/artifacts:/data/artifacts
    mem_limit: 512m
    cpus: 1
    networks: [backend]
  worker:
    <<: *runtime
    image: ${SCRIPTALOCAL_WORKER_IMAGE:?Set tested immutable worker image ID}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    devices: ['${SCRIPTALOCAL_GPU:-nvidia.com/gpu=0}']
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
      - ${SCRIPTALOCAL_SERVICE_ROOT}/settings/worker.json:/settings/worker.json:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/db-dsn:/run/secrets/db_dsn:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/originals:/data/originals:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/artifacts:/data/artifacts
      - ${SCRIPTALOCAL_SERVICE_ROOT}/status:/status
      - ${SCRIPTALOCAL_MODEL_ROOT:?}:/model:ro
    healthcheck:
      test: [CMD,python,-m,scriptalocal.service_admin,health-worker,--marker,/status/ready.json,--maximum-age,'20']
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    stop_grace_period: 150s
    tmpfs: !override [/tmp:size=256m]
    mem_limit: 8g
    cpus: 2
    networks: [backend]
  api:
    <<: *runtime
    image: ${SCRIPTALOCAL_API_IMAGE:?Set tested immutable API image ID}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      SCRIPTALOCAL_CONFIG: /settings/api.json
    ports: ['127.0.0.1:${SCRIPTALOCAL_API_PORT:-8090}:8090']
    volumes:
      - ${SCRIPTALOCAL_SERVICE_ROOT}/settings:/settings:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/db-dsn:/run/secrets/db_dsn:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/secrets/health.token:/run/secrets/health_token:ro
      - ${SCRIPTALOCAL_SERVICE_ROOT}/originals:/data/originals
      - ${SCRIPTALOCAL_SERVICE_ROOT}/artifacts:/data/artifacts
      - ${SCRIPTALOCAL_SERVICE_ROOT}/status:/status:ro
    healthcheck:
      test: [CMD,python,-m,scriptalocal.service_admin,health-api,--token-file,/run/secrets/health_token,--port,'8090']
      interval: 10s
      timeout: 4s
      start_period: 60s
      retries: 3
    mem_limit: 1g
    cpus: 2
    networks: [backend,edge]
networks:
  backend: {internal: true}
  edge: {}
