services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: scriptalocal_test
      POSTGRES_DB: scriptalocal_queue_validation
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ${SCRIPTALOCAL_JOB_VALIDATION_ROOT:?}/postgres:/var/lib/postgresql/data
      - ${SCRIPTALOCAL_JOB_VALIDATION_ROOT}/db-password:/run/secrets/db_password:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scriptalocal_test -d scriptalocal_queue_validation']
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging:
      options:
        max-size: 5m
        max-file: '2'
  tests:
    image: ${SCRIPTALOCAL_JOB_TEST_IMAGE:-scriptalocal-jobs-validation:locked}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCRIPTALOCAL_TEST_DSN_FILE: /run/secrets/db_dsn
      SCRIPTALOCAL_ALLOW_DATABASE_TESTS: '1'
    volumes:
      - ${SCRIPTALOCAL_JOB_VALIDATION_ROOT}/db-dsn:/run/secrets/db_dsn:ro
      - ${SCRIPTALOCAL_PROJECT_ROOT:?}/scriptalocal:/app/scriptalocal:ro
      - ${SCRIPTALOCAL_PROJECT_ROOT}/integration_tests:/app/integration_tests:ro
      - ${SCRIPTALOCAL_PROJECT_ROOT}/docs/api/examples:/app/docs/api/examples:ro
      - ${SCRIPTALOCAL_PROJECT_ROOT}/scripts/validation:/app/scripts/validation:ro
      - ${SCRIPTALOCAL_JOB_VALIDATION_ROOT}/artifacts:/artifacts
    read_only: true
    user: '1000:1000'
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    profiles: [tests]
networks:
  default:
    internal: true
